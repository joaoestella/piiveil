name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  # Os testes precisam do Node 22+, mas os hooks rodam no Node do usuário: confere o bundle no mínimo suportado.
  bundle-node18:
    name: bundle (node 18)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: version
        run: test "$(node dist/piiveil.mjs --version)" = "$(node -p 'require("./package.json").version')"
      - name: PostToolUse masks a CPF
        env:
          PIIVEIL_HOME: ${{ runner.temp }}/piiveil-home
          CLAUDE_PROJECT_DIR: ${{ runner.temp }}/project
        run: |
          out=$(echo '{"hook_event_name":"PostToolUse","tool_name":"Bash","tool_response":{"stdout":"CPF 111.444.777-35","stderr":""}}' | node dist/piiveil.mjs hook post-tool-use)
          echo "$out"
          echo "$out" | grep -q '\[CPF_1\]'
          ! echo "$out" | grep -q '111.444.777-35'
